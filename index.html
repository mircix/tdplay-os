<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TDPlay OS</title>
<meta name="description" content="TDPlay OS — a music desktop built on every song ever featured on tdplay.site: YouTube player, Spotify, Apple Music and an artist browser.">
<meta name="theme-color" content="#07070c">
<link rel="icon" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<meta property="og:title" content="TDPlay OS">
<meta property="og:description" content="A music desktop built on every song ever featured on tdplay.site.">
<meta property="og:image" content="https://mircix.github.io/tdplay-os/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/os.css?v=202609190503">
</head>
<body>

<!-- boot screen -->
<div id="boot" class="boot">
  <div class="boot-inner">
    <img class="boot-logo" src="assets/logo.png" alt="TDPlay">
    <div class="boot-title">TDPlay <em>OS</em></div>
    <div class="boot-bar"><div id="boot-fill" class="boot-fill"></div></div>
    <div id="boot-status" class="boot-status">Starting…</div>
  </div>
  <div class="boot-foot">tdplay.site · every song, every month, since 2020</div>
</div>

<!-- desktop -->
<div id="desktop" class="desktop" hidden>
  <div id="wallpaper" class="wallpaper" data-wall="aurora">
    <div class="wp-blob wp-a"></div><div class="wp-blob wp-b"></div><div class="wp-blob wp-c"></div>
    <div id="wp-art" class="wp-art"></div>
    <div class="wp-grain"></div>
  </div>

  <div id="topbar" class="topbar">
    <button id="tb-logo" class="tb-logo" title="TDPlay OS"><img src="assets/logo.png" alt=""></button>
    <div id="tb-app" class="tb-app">TDPlay OS</div>
    <div id="tb-now" class="tb-now" hidden>
      <img id="tb-now-art" class="tb-now-art" alt="">
      <div class="tb-now-text"><b id="tb-now-title"></b><span id="tb-now-sub"></span></div>
      <button id="tb-now-toggle" class="tb-now-btn" title="Play / pause">❚❚</button>
      <button id="tb-now-next" class="tb-now-btn" title="Next">⏭</button>
    </div>
    <div class="tb-right">
      <button id="tb-search" class="tb-btn" title="Search (⌘K)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </button>
      <div id="tb-spotify" class="tb-spot" title="Spotify not connected"><span class="dot"></span></div>
      <button id="tb-full" class="tb-btn" title="Full screen">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <div id="tb-clock" class="tb-clock">--:--</div>
    </div>
  </div>

  <div id="windows" class="windows"></div>

  <div id="dock" class="dock"></div>

  <div id="pip" class="pip" hidden>
    <div id="pip-slot" class="pip-slot"></div>
    <div class="pip-bar">
      <button id="pip-open" class="pip-btn" title="Open Player">⤢</button>
      <button id="pip-toggle" class="pip-btn" title="Play / pause">❚❚</button>
      <button id="pip-next" class="pip-btn" title="Next">⏭</button>
      <button id="pip-close" class="pip-btn" title="Stop">✕</button>
    </div>
  </div>
  <!-- YouTube player lives here, positioned over whichever window shows it -->
  <div id="yt-layer" class="yt-layer" hidden><div id="yt-host"></div></div>

  <div id="menu" class="menu" hidden></div>
  <div id="launcher" class="launcher" hidden>
    <div class="launcher-box glass">
      <div class="launcher-row">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="launcher-input" type="text" placeholder="Search apps, artists, songs, months…" autocomplete="off" spellcheck="false">
        <kbd>esc</kbd>
      </div>
      <div id="launcher-results" class="launcher-results"></div>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>
</div>

<script src="js/util.js?v=202609190503"></script>
<script src="js/data.js?v=202609190503"></script>
<script src="js/ui.js?v=202609190503"></script>
<script src="js/wm.js?v=202609190503"></script>
<script src="js/player.js?v=202609190503"></script>
<script src="js/spotify.js?v=202609190503"></script>
<script src="js/youtube.js?v=202609190503"></script>
<script src="js/apps/home.js?v=202609190503"></script>
<script src="js/apps/library.js?v=202609190503"></script>
<script src="js/apps/playerapp.js?v=202609190503"></script>
<script src="js/apps/spotifyapp.js?v=202609190503"></script>
<script src="js/apps/apple.js?v=202609190503"></script>
<script src="js/apps/artists.js?v=202609190503"></script>
<script src="js/apps/browser.js?v=202609190503"></script>
<script src="js/apps/terminal.js?v=202609190503"></script>
<script src="js/apps/stats.js?v=202609190503"></script>
<script src="js/apps/settings.js?v=202609190503"></script>
<script src="js/apps/about.js?v=202609190503"></script>
<script src="js/os.js?v=202609190503"></script>
</body>
</html>
