name: Probe artist websites
# Re-checks which artist websites allow being shown inside the OS Browser (sites.json).
on:
  schedule:
    - cron: "17 4 * * 1"     # Mondays 04:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/probe_sites.py
      - name: Commit if changed
        run: |
          git config user.name "tdplay-os bot"
          git config user.email "actions@users.noreply.github.com"
          git add sites.json
          git diff --cached --quiet || git commit -m "Refresh sites.json"
          git push
