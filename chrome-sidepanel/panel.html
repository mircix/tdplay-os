<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Instagram · TDPlay OS</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #07070c; color: #fff;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
  .bar { display: flex; gap: 3px; align-items: center; padding: 6px 6px; background: rgba(16,16,24,.98);
    border-bottom: 1px solid rgba(255,255,255,.1); overflow-x: auto; scrollbar-width: none; }
  .bar::-webkit-scrollbar { display: none; }
  .bar button { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); color: #fff;
    border-radius: 8px; padding: 5px 7px; font: inherit; cursor: pointer; white-space: nowrap; flex: none; }
  #ig { padding: 0; border: 0; background: none; line-height: 0; flex: none; }
  #ig svg { width: 22px; height: 22px; border-radius: 6px; display: block; }
  #ig:hover { background: none; transform: scale(1.08); }
  #ig:active { transform: scale(.96); }
  #full { padding: 4px 6px; }
  #full svg { width: 15px; height: 15px; display: block; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bar button:hover { background: rgba(255,255,255,.16); }
  .bar button.on { background: #ff2b2b; border-color: transparent; color: #0a0a0f; font-weight: 600; }
  .bar .sp { flex: 1; }
  iframe { display: block; width: 100%; height: calc(100% - 35px); border: 0; background: #000; }
  .note { position: absolute; left: 0; right: 0; bottom: 0; padding: 9px 10px; font-size: 12px;
    color: #c8c8d4; background: rgba(16,16,24,.98); border-top: 1px solid rgba(255,255,255,.1); }
  .note a { color: #b1ffff; }
  .note[hidden] { display: none; }
  .note button { margin: 6px 6px 0 0; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16);
    color: #fff; border-radius: 7px; padding: 4px 9px; font: inherit; cursor: pointer; }
  .note button:hover { background: rgba(255,255,255,.2); }
</style>
</head>
<body>
  <div class="bar">
    <button id="ig" title="Instagram — Home" aria-label="Instagram — Home"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="gIg" cx=".3" cy="1.05" r="1.25"><stop offset="0" stop-color="#fdd835"/><stop offset=".25" stop-color="#f9a825"/><stop offset=".5" stop-color="#e91e63"/><stop offset=".78" stop-color="#9c27b0"/><stop offset="1" stop-color="#3f51b5"/></radialGradient></defs><rect width="64" height="64" rx="14.5" fill="url(#gIg)"/><rect x="14" y="14" width="36" height="36" rx="10.5" fill="none" stroke="#fff" stroke-width="3.6"/><circle cx="32" cy="32" r="8.6" fill="none" stroke="#fff" stroke-width="3.6"/><circle cx="41.8" cy="22.2" r="2.4" fill="#fff"/></svg></button>
    <button data-go="" class="on">Home</button>
    <button data-go="reels/">Reels</button>
    <button data-go="explore/">Explore</button>
    <button data-go="direct/inbox/">DMs</button>
    <span class="sp"></span>
    <button id="tdplay" title="TDPlay OS in the panel">TDPlay OS</button>
    <button id="full" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="reload" title="Reload">⟳</button>
  </div>
  <iframe id="f"
          allow="autoplay; encrypted-media; clipboard-write; picture-in-picture; fullscreen"></iframe>
  <div class="note" id="fix" hidden><span id="fix-msg"></span>
    <span id="fix-btns"><button id="fix-reload">Try again</button><button id="fix-tab">Open in a tab</button></span></div>
  <script src="panel.js"></script>
</body>
</html>
