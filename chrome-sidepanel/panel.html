<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Instagram · TDPlay OS</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #07070c; color: #fff;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
  .bar { display: flex; gap: 4px; align-items: center; padding: 6px 8px; background: rgba(16,16,24,.98);
    border-bottom: 1px solid rgba(255,255,255,.1); }
  .bar button { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); color: #fff;
    border-radius: 8px; padding: 5px 9px; font: inherit; cursor: pointer; white-space: nowrap; }
  .bar button:hover { background: rgba(255,255,255,.16); }
  .bar button.on { background: #ff2b2b; border-color: transparent; color: #0a0a0f; font-weight: 600; }
  .bar .sp { flex: 1; }
  iframe { display: block; width: 100%; height: calc(100% - 35px); border: 0; background: #000; }
  .note { position: absolute; left: 0; right: 0; bottom: 0; padding: 9px 10px; font-size: 12px;
    color: #c8c8d4; background: rgba(16,16,24,.98); border-top: 1px solid rgba(255,255,255,.1); }
  .note a { color: #b1ffff; }
  .note[hidden] { display: none; }
  .note button { margin: 6px 6px 0 0; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16);
    color: #fff; border-radius: 7px; padding: 4px 9px; font: inherit; cursor: pointer; }
  .note button:hover { background: rgba(255,255,255,.2); }
</style>
</head>
<body>
  <div class="bar">
    <button data-go="" class="on">Home</button>
    <button data-go="reels/">Reels</button>
    <button data-go="explore/">Explore</button>
    <button data-go="direct/inbox/">DMs</button>
    <span class="sp"></span>
    <button id="tdplay" title="TDPlay OS in the panel">TDPlay OS</button>
    <button id="reload" title="Reload">⟳</button>
  </div>
  <iframe id="f"
          allow="autoplay; encrypted-media; clipboard-write; picture-in-picture; fullscreen"></iframe>
  <div class="note" id="fix" hidden><span id="fix-msg"></span>
    <span id="fix-btns"><button id="fix-reload">Try again</button><button id="fix-tab">Open in a tab</button></span></div>
  <script src="panel.js"></script>
</body>
</html>
